schema_version: 1

requirement_levels:
  - REQUIRED
  - DISCOVERY_REQUIRED
  - PREFERRED
  - ADVISORY

capabilities:
  shared_context_evidence:
    requirement: PREFERRED
    description: >
      Shared product-neutral knowledge, context, evidence, decision, memory, and
      retrieval support when a task materially benefits from cross-session,
      cross-repository, provenance-aware, or structured context/evidence work.
    triggers:
      - shared agent context retrieval
      - cross-repository context synthesis
      - provenance-aware evidence retrieval
      - durable decision context
      - agent memory or retrieval infrastructure
      - knowledge or evidence ingestion for agent work
    exclusions:
      - ordinary repository live-state inspection
      - GitHub issue or pull-request truth
      - simple source-code reading within one repository
      - tasks where target-repository local evidence is already sufficient
    tool:
      name: Agent Brain
      identity: jannekbuengener/agent-brain
      upstream: https://github.com/jannekbuengener/agent-brain
    availability:
      require_available: false
      require_authorized: true
      silent_substitution: true

  deterministic_validation:
    requirement: PREFERRED
    description: >
      Domain-neutral deterministic validation, evaluation, gates, provenance,
      comparisons, stability analysis, and evidence bundles when acceptance
      materially depends on reproducible evaluation rather than ordinary tests alone.
    triggers:
      - deterministic evaluation
      - acceptance gate design
      - reproducible evidence bundle
      - baseline comparison
      - PASS FAIL HOLD decision logic
      - stability or resampling validation
      - portable validation contract
    exclusions:
      - ordinary unit tests with sufficient repository-local assertions
      - routine lint or formatting checks
      - tasks where the target repository already owns an equivalent validation contract
      - subjective review without a deterministic evaluation target
    tool:
      name: ARVP
      identity: jannekbuengener/arvp
      upstream: https://github.com/jannekbuengener/arvp
    availability:
      require_available: false
      require_authorized: true
      silent_substitution: true

  reverse_engineering:
    requirement: REQUIRED
    description: >
      Reverse engineering of binaries, applications, packaged runtimes, and
      behavior where the task intent is to reconstruct or inspect implementation
      rather than perform ordinary documentation or web research.
    triggers:
      - binary reverse engineering
      - proprietary application behavior reconstruction
      - application behavior reconstruction
      - native binary inspection
      - Electron application analysis
      - JavaScript application reverse engineering
      - .NET assembly analysis
      - runtime behavior investigation
      - website behavior reconstruction
    exclusions:
      - ordinary web research
      - ordinary documentation lookup
      - source-available code review that does not require reverse engineering
    tool:
      name: REA
      identity: morluto/rea
      upstream: https://github.com/morluto/rea
    availability:
      require_available: true
      require_authorized: true
      unavailable_outcome: BLOCKED_REQUIRED_CAPABILITY_UNAVAILABLE
      unauthorized_outcome: BLOCKED_REQUIRED_CAPABILITY_UNAVAILABLE
      silent_substitution: false

  reuse_before_build:
    requirement: DISCOVERY_REQUIRED
    description: >
      Bounded engineering discovery before a meaningful implementation-path
      decision would introduce new code, dependencies, tooling, services,
      subsystems, or infrastructure.
    contract: docs/REUSE_BEFORE_BUILD.md
    triggers:
      - planning a new implementation path
      - adding a new capability or subsystem
      - considering a new dependency or package
      - considering a new external tool or service
      - introducing new infrastructure or runtime machinery
      - substantial custom functionality with plausible existing alternatives
    exclusions:
      - trivial bug fix with an existing clear solution
      - documentation-only change
      - straightforward use of an existing repository primitive
      - small refactor without a meaningful build-vs-reuse decision
      - analysis that does not select an implementation path
    discovery:
      order:
        - existing repository implementation or reusable primitives
        - dependencies already used by the target repository
        - established language/runtime libraries or packages
        - suitable maintained open-source projects or tools
        - existing Agent Workforce capabilities or tools
        - official documentation, upstream issues, release notes, and compatibility constraints
        - custom implementation when prior options are insufficient
      outcomes:
        - REUSE_EXISTING
        - ADOPT_DEPENDENCY_OR_TOOL
        - BUILD_CUSTOM
      bounded: true
      automatic_mutation_authority: false
