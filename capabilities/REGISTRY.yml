schema_version: 1

requirement_levels:
  - REQUIRED
  - DISCOVERY_REQUIRED
  - PREFERRED
  - ADVISORY

capabilities:
  shared_context_evidence:
    requirement: PREFERRED
    description: >
      Shared product-neutral knowledge, context, evidence, decision, memory, and
      retrieval support when a task materially benefits from cross-session,
      cross-repository, provenance-aware, or structured context/evidence work.
    triggers:
      - shared agent context retrieval
      - cross-repository context synthesis
      - provenance-aware evidence retrieval
      - durable decision context
      - agent memory or retrieval infrastructure
      - knowledge or evidence ingestion for agent work
    exclusions:
      - ordinary repository live-state inspection
      - GitHub issue or pull-request truth
      - simple source-code reading within one repository
      - tasks where target-repository local evidence is already sufficient
    tool:
      name: Agent Brain
      identity: jannekbuengener/agent-brain
      upstream: https://github.com/jannekbuengener/agent-brain
    availability:
      require_available: false
      require_authorized: true
      silent_substitution: true

  deterministic_validation:
    requirement: PREFERRED
    description: >
      Domain-neutral deterministic validation, evaluation, gates, provenance,
      comparisons, stability analysis, and evidence bundles when acceptance
      materially depends on reproducible evaluation rather than ordinary tests alone.
    triggers:
      - deterministic evaluation
      - acceptance gate design
      - reproducible evidence bundle
      - baseline comparison
      - PASS FAIL HOLD decision logic
      - stability or resampling validation
      - portable validation contract
    exclusions:
      - ordinary unit tests with sufficient repository-local assertions
      - routine lint or formatting checks
      - tasks where the target repository already owns an equivalent validation contract
      - subjective review without a deterministic evaluation target
    tool:
      name: ARVP
      identity: jannekbuengener/arvp
      upstream: https://github.com/jannekbuengener/arvp
    availability:
      require_available: false
      require_authorized: true
      silent_substitution: true

  reverse_engineering:
    requirement: REQUIRED
    description: >
      Reverse engineering of binaries, applications, packaged runtimes, and
      behavior where the task intent is to reconstruct or inspect implementation
      rather than perform ordinary documentation or web research.
    triggers:
      - binary reverse engineering
      - proprietary application behavior reconstruction
      - application behavior reconstruction
      - native binary inspection
      - Electron application analysis
      - JavaScript application reverse engineering
      - .NET assembly analysis
      - runtime behavior investigation
      - website behavior reconstruction
    exclusions:
      - ordinary web research
      - ordinary documentation lookup
      - source-available code review that does not require reverse engineering
    tool:
      name: REA
      identity: morluto/rea
      upstream: https://github.com/morluto/rea
    availability:
      require_available: true
      require_authorized: true
      unavailable_outcome: BLOCKED_REQUIRED_CAPABILITY_UNAVAILABLE
      unauthorized_outcome: BLOCKED_REQUIRED_CAPABILITY_UNAVAILABLE
      silent_substitution: false

  reuse_before_build:
    requirement: DISCOVERY_REQUIRED
    description: >
      Bounded engineering discovery before a meaningful implementation-path
      decision would introduce new code, dependencies, tooling, services,
      subsystems, or infrastructure.
    contract: docs/REUSE_BEFORE_BUILD.md
    triggers:
      - planning a new implementation path
      - adding a new capability or subsystem
      - considering a new dependency or package
      - considering a new external tool or service
      - introducing new infrastructure or runtime machinery
      - substantial custom functionality with plausible existing alternatives
    exclusions:
      - trivial bug fix with an existing clear solution
      - documentation-only change
      - straightforward use of an existing repository primitive
      - small refactor without a meaningful build-vs-reuse decision
      - analysis that does not select an implementation path
    discovery:
      order:
        - existing repository implementation or reusable primitives
        - dependencies already used by the target repository
        - established language/runtime libraries or packages
        - suitable maintained open-source projects or tools
        - existing Agent Workforce capabilities or tools
        - official documentation, upstream issues, release notes, and compatibility constraints
        - custom implementation when prior options are insufficient
      outcomes:
        - REUSE_EXISTING
        - ADOPT_DEPENDENCY_OR_TOOL
        - BUILD_CUSTOM
      bounded: true
      automatic_mutation_authority: false

  improvement_read:
    requirement: PREFERRED
    description: >
      Read Improvement Blackboard records, observation history, dedupe
      candidates, and relations without mutating blackboard state. Does not
      authorize observation writes, management writes, general Agent Brain
      Memory/Knowledge writes, or GitHub issue creation.
    triggers:
      - read open or active skill improvements
      - inspect improvement observation history
      - inspect improvement dedupe candidates or relations
    exclusions:
      - ordinary repository live-state inspection unrelated to the blackboard
      - GitHub issue or pull-request truth as product authority
      - general Agent Brain memory or knowledge retrieval outside improvements
    tool:
      name: Agent Brain
      identity: jannekbuengener/agent-brain
      upstream: https://github.com/jannekbuengener/agent-brain
    availability:
      require_available: false
      require_authorized: true
      silent_substitution: true

  improvement_observation_write:
    requirement: REQUIRED
    description: >
      Append Improvement Blackboard observations / evidence under the
      Improvement Board Manager specialist. Not granted to Quality Scout,
      Process Scout, or Workforce Supervisor. Not satisfied by
      shared_context_evidence alone. Does not authorize management merges,
      lifecycle transitions, general Memory/Knowledge writes, or GitHub issues.
    triggers:
      - record a skill-learning observation on the improvement blackboard
      - append evidence to an existing improvement observation history
    exclusions:
      - Scout Health Book evidence comments
      - Scout or Supervisor checkpoint updates
      - general Agent Brain memory or knowledge writes
      - improvement merge, priority, or lifecycle management
      - GitHub issue creation
    tool:
      name: Agent Brain
      identity: jannekbuengener/agent-brain
      upstream: https://github.com/jannekbuengener/agent-brain
    availability:
      require_available: true
      require_authorized: true
      unavailable_outcome: BLOCKED_REQUIRED_CAPABILITY_UNAVAILABLE
      unauthorized_outcome: BLOCKED_REQUIRED_CAPABILITY_UNAVAILABLE
      silent_substitution: false

  improvement_management_write:
    requirement: REQUIRED
    description: >
      Authoritative Improvement Blackboard management writes: validate dedupe,
      merge with audited lineage, set priority, transition lifecycle, link
      related work, and record verification results. Authorized only for the
      Improvement Board Manager specialist. Not granted to scouts or
      Supervisor. Not satisfied by shared_context_evidence alone. Does not
      authorize general Memory/Knowledge writes or GitHub issue creation.
    triggers:
      - validate improvement dedupe candidates
      - merge improvements with audited lineage
      - set or change improvement priority
      - transition improvement lifecycle state
      - link related improvements or work items
      - record improvement verification results
    exclusions:
      - Scout advisory recommendations without blackboard management authority
      - automatic follow-up issue creation by scouts or Supervisor
      - general Agent Brain memory or knowledge writes
      - skill-code mutation
      - implementation pull-request creation
      - GitHub issue creation (separate capability)
    tool:
      name: Agent Brain
      identity: jannekbuengener/agent-brain
      upstream: https://github.com/jannekbuengener/agent-brain
    availability:
      require_available: true
      require_authorized: true
      unavailable_outcome: BLOCKED_REQUIRED_CAPABILITY_UNAVAILABLE
      unauthorized_outcome: BLOCKED_REQUIRED_CAPABILITY_UNAVAILABLE
      silent_substitution: false

  improvement_github_issue_create:
    requirement: REQUIRED
    description: >
      Bounded creation of a GitHub implementation issue for a validated
      Improvement in the owning repository. Separate from management write.
      Authorized only for the Improvement Board Manager under the Workforce
      contract stub docs/IMPROVEMENT_GITHUB_ISSUE_CREATE.md (issue #51).
      Denied for Quality Scout, Process Scout, and Supervisor. Until #51 is
      complete, hosts must HOLD rather than create issues.
    contract: docs/IMPROVEMENT_GITHUB_ISSUE_CREATE.md
    triggers:
      - create GitHub implementation issue from a validated improvement
      - hand off a planned improvement to owning-repository issue tracking
    exclusions:
      - Scout or Supervisor automatic follow-up issue creation
      - management write without the separate issue-create capability
      - issue creation when owning repository is ambiguous
      - issue creation for unvalidated improvements
      - implementation pull-request creation
      - general Agent Brain memory or knowledge writes
    availability:
      require_available: true
      require_authorized: true
      unavailable_outcome: BLOCKED_REQUIRED_CAPABILITY_UNAVAILABLE
      unauthorized_outcome: BLOCKED_REQUIRED_CAPABILITY_UNAVAILABLE
      silent_substitution: false

